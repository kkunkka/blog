# 部署 Docusaurus(blog 项目) 到 VPS，接管线上站点 kkunkka.site
# 与 hugo 仓库的旧部署(main.yml) 类似，但：
#   - 构建产物目录为 ./build/ (Docusaurus) 而非 ./public/ (Hugo)
#   - 目标目录为 /root/app/blog (新建，独立于 hugo 的 /root/app/hugo)
# 需要在 blog 仓库 Settings > Secrets 配置:
#   REMOTE_HOST / REMOTE_USER / REMOTE_PRIVATE_KEY (与 hugo 仓库一致)

name: Deploy to VPS (kkunkka.site)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        # 不设环境变量 -> 使用 docusaurus.config.js 默认值 (url=kkunkka.site, baseUrl=/)
        run: pnpm build

      - name: Deploy to VPS via rsync
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: -avz --delete
          path: ./build/        # 末尾斜杠: 复制目录内容到目标目录
          remote_path: /root/app/blog
          remote_host: ${{ secrets.REMOTE_HOST }}
          remote_user: ${{ secrets.REMOTE_USER }}
          remote_key: ${{ secrets.REMOTE_PRIVATE_KEY }}
          remote_port: 5222
